name: iOS
on: [push, pull_request]
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --dart-define=DOCUMENT_DEBUG=true
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Runner-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: Runner-unsigned.ipa

  # Appetize / Simulator only accept a simulator .app, not the device IPA above.
  # Flutter forbids --release with --simulator, hence debug.
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Zip simulator app
        run: |
          cd build/ios/iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/Runner-simulator.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-simulator-app
          path: Runner-simulator.zip
